<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAPS Screen</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd;
          --ok:#1f7a3d; --bad:#b3261e; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --text:#ececea; --muted:#9b9b95; --line:#33332f;
            --ok:#5cc27e; --bad:#ff8a80; --warn:#e3b341; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size:18px; margin:0 0 12px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  h2 { font-size:15px; margin:0; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
  .stamp { color:var(--muted); font-size:12px; white-space:nowrap; }
  .stale { color:var(--warn); font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  td { padding:4px 6px 4px 0; border-top:1px solid var(--line); vertical-align:top; }
  .muted { color:var(--muted); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .wide { grid-column:1 / -1; }
</style>
</head>
<body>
<h1>MAPS Screen</h1>
<div class="grid">
  <section id="todo"><div class="head"><h2>Due and waiting</h2><span class="stamp"></span></div><div class="body"></div></section>
  <section id="routines"><div class="head"><h2>Routines</h2><span class="stamp"></span></div><div class="body"></div></section>
  <section id="sync"><div class="head"><h2>Sync</h2><span class="stamp"></span></div><div class="body"></div></section>
</div>
<script>
// Show, don't store: this page only reads /data/*.json and keeps nothing.
function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function row(cells) { const tr = el("tr"); cells.forEach(c => { const td = el("td"); if (c instanceof Node) td.append(c); else td.textContent = c ?? ""; tr.append(td); }); return tr; }
function statusSpan(s) { s = s || ""; return el("span", s, s.startsWith("OK") ? "ok" : (s.startsWith("CAPPED") ? "warn" : "bad")); }
function short(t) { return t ? t.replace("T", " ").slice(0, 16) : ""; }

const render = {
  todo(d, body) {
    const t = el("table");
    if (!d.rows.length) body.append(el("p", "Nothing open.", "muted"));
    d.rows.forEach(r => {
      let when = r.kind === "waiting" ? el("span", "waiting", "muted")
        : r.days_left == null ? el("span", "no date", "muted")
        : r.days_left < 0 ? el("span", (-r.days_left) + "d late", "bad")
        : r.days_left === 0 ? el("span", "today", "warn") : el("span", "in " + r.days_left + "d", "muted");
      t.append(row([when, r.text]));
    });
    body.append(t);
  },
  routines(d, body) {
    const c = d.caps || {};
    body.append(el("p", `Runs today ${c.runs_today}/${c.max_runs_per_day}, last ${c.window_minutes} min ${c.runs_in_window}/${c.max_runs_per_window}, cost today $${d.cost_today_usd}`, "muted"));
    const t = el("table");
    d.rows.forEach(r => t.append(row([r.name, r.enabled ? r.schedule : "disabled", short(r.last_time), statusSpan(r.last_status)])));
    body.append(t);
    if ((d.recent || []).length) {
      body.append(el("p", "Recent runs", "muted"));
      const t2 = el("table");
      d.recent.forEach(r => t2.append(row([short(r.time), r.name, "$" + r.cost, statusSpan(r.status)])));
      body.append(t2);
    }
  },
  sync(d, body) {
    const t = el("table");
    d.rows.forEach(r => t.append(row([short(r.time), statusSpan(r.status), r.detail])));
    body.append(t);
  },
};

async function load(name) {
  const sec = document.getElementById(name), body = sec.querySelector(".body"), stamp = sec.querySelector(".stamp");
  body.replaceChildren(); stamp.className = "stamp";
  try {
    const d = await (await fetch("/data/" + name + ".json", {cache: "no-store"})).json();
    if (d.missing) { stamp.textContent = "no data yet"; stamp.classList.add("stale"); return; }
    const age = (Date.now() - new Date(d.generated).getTime()) / 60000;
    stamp.textContent = "updated " + short(d.generated) + (age > d.stale_minutes ? " (stale)" : "");
    if (age > d.stale_minutes) stamp.classList.add("stale");
    render[name](d, body);
  } catch (e) { stamp.textContent = "could not read"; stamp.classList.add("stale"); }
}
function loadAll() { ["todo", "routines", "sync"].forEach(load); }
loadAll(); setInterval(loadAll, 60000);
</script>
</body>
</html>
